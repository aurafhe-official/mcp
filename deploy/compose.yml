# Diagnostic stdio only: docker compose run --rm -T mcp
# Set host UID/GID and grant this identity access to ciphertext-only mounts.
services:
  mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "${AURA_UID:-1000}:${AURA_GID:-1000}"
    stdin_open: true
    environment:
      AFHE_INPUT_BUNDLE: /inputs/encrypted-inputs.json
      AFHE_RESULT_DIR: /results
      AFHE_COMPUTE_URL: ${AFHE_COMPUTE_URL:?Set verified HTTPS worker URL}
      AFHE_COMPUTE_API_KEY: ${AFHE_COMPUTE_API_KEY:?Set compute-only token}
      AFHE_KEY_ID: ${AFHE_KEY_ID:?Set key ID}
    volumes:
      - ${AURA_ENCRYPTED_INPUT_DIR:?Set ciphertext input directory}:/inputs:ro
      - ${AURA_ENCRYPTED_RESULT_DIR:?Set ciphertext output directory}:/results
