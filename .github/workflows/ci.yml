name: Unpublished reference checks
on:
  push:
    branches: [verified]
  pull_request:
    branches: [verified]
permissions:
  contents: read
jobs:
  reference:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node -e "if (!require('./package.json').private) process.exit(1)"
