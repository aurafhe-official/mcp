startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      apiUrl:
        type: string
        description: Private-compute backend URL
        default: https://api.afhe.io:8443
      apiKey:
        type: string
        description: Optional bearer token
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js'],
      env: Object.fromEntries(
        Object.entries({
          AFHE_API_URL: config.apiUrl || 'https://api.afhe.io:8443',
          AFHE_API_KEY: config.apiKey || undefined,
        }).filter(([, value]) => value != null)
      ),
    })
